spring.application.name=misakanetworks-core

spring.r2dbc.url=${DB_URL:r2dbc:mysql://localhost:3306/misakanetworks}
spring.r2dbc.username=${DB_USERNAME:root}
spring.r2dbc.password=${DB_PASSWORD:}
spring.sql.init.mode=always

server.port=${PORT:8080}

# 反代场景：信任 nginx 的 X-Forwarded-Proto，让 request.uri.scheme 正确反映 https。
# SameOriginFilter 靠它判断同源——不加的话浏览器 Origin=https 与内部 http 对不上，
# 所有浏览器发起的 /api/ 请求都会 403「跨域请求被拒绝」。
server.forward-headers-strategy=framework

app.jwt.secret=${JWT_SECRET:misakanetworks-dev-secret-change-me-0123456789abcdef}
app.jwt.access-ttl-minutes=1440
app.jwt.bind-ttl-minutes=10
app.totp.issuer=MisakaNetworks
app.images.storage-dir=${IMAGE_STORAGE_DIR:./data/images}
app.images.encryption-key=${IMAGE_ENCRYPTION_KEY:misakanetworks-image-key-0123456}
app.images.storage-type=${IMAGE_STORAGE_TYPE:local}
app.images.endpoint=${OSS_ENDPOINT:}
app.images.access-key-id=${OSS_ACCESS_KEY_ID:}
app.images.access-key-secret=${OSS_ACCESS_KEY_SECRET:}
app.images.bucket=${OSS_BUCKET:}
app.security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}

springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
