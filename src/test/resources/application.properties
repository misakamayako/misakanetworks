spring.application.name=misakanetworks-core-test

spring.r2dbc.url=r2dbc:h2:mem:///testdb;MODE=MySQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.r2dbc.username=sa
spring.r2dbc.password=
spring.sql.init.mode=always

app.jwt.secret=test-secret-test-secret-test-secret-1234567890
app.jwt.access-ttl-minutes=60
app.jwt.bind-ttl-minutes=10
app.totp.issuer=MisakaNetworks
app.images.storage-dir=build/test-images
app.images.encryption-key=test-image-key-01234567890123456
app.security.rate-limit.enabled=false
