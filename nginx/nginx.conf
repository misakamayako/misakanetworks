events {}

http {
    # 必须引入 mime.types，否则所有文件都按 text/plain 返回，
    # 浏览器对 ES module 脚本的严格 MIME 检查会直接拒绝加载
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 后端容器（compose 服务名）
    upstream misaka_app {
        server app:8080;
    }

    # 80 端口：acme 验证放行，其余跳 HTTPS
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS 入口
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        client_max_body_size 25m;

        location /api/ {
            proxy_pass http://misaka_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Swagger（生产建议 SWAGGER_ENABLED=false，接口本身会 404）
        location = /v3/api-docs {
            proxy_pass http://misaka_app;
        }
        location /swagger-ui/ {
            proxy_pass http://misaka_app;
        }

        # 其他 well-known 文件（security.txt 等）：对应 ./nginx/wellknown/ 目录，
        # 按 /.well-known/xxx 直接映射；acme-challenge 只在 80 端口，不受影响
        location ^~ /.well-known/ {
            alias /var/www/wellknown/;
            default_type text/plain;
            add_header Cache-Control "no-store";
        }

        # 纯静态前端：/usr/share/nginx/html 由 compose 挂载前端构建产物（frontend-dist）。
        # /api/、/v3/api-docs、/swagger-ui/ 是更精确的 location，优先匹配，不受影响
        location / {
            root /usr/share/nginx/html;
            index index.html;
            # SPA 路由回退：干净的 URL 都回落到 index.html
            # （Astro 静态站每个路由本身有真实 html 文件，回退只是兜底）
            try_files $uri $uri/ /index.html;
        }

        # Astro 默认把带哈希的静态资源放 /_astro/，可长缓存；若资源目录不同，改这里
        location /_astro/ {
            root /usr/share/nginx/html;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
