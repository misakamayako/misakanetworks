name: Build & Deploy

on:
  push:
#    branches: [main, master]
  workflow_dispatch:
    inputs:
      deploy_version:
        description: 要部署到 ECS 的镜像标签（留空 = 当前 commit）
        required: false

env:
  PLATFORM: linux/amd64
  # 临时允许第三方 action 使用已被弃用的 Node 20 运行时（GitHub 强制后需移除）
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  build-and-push:
    environment: aliyun
    env:
      # 环境变量（vars）在 job 级才可见，所以镜像名在这里拼
      IMAGE_BASE: ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/misakanetworks-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check ACR configuration
        env:
          REGISTRY: ${{ vars.ACR_REGISTRY }}
          NAMESPACE: ${{ vars.ACR_NAMESPACE }}
          USERNAME: ${{ secrets.ACR_USERNAME }}
          PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          test -n "$REGISTRY"  || { echo "::error::缺少 GitHub Variable: ACR_REGISTRY"; exit 1; }
          test -n "$NAMESPACE" || { echo "::error::缺少 GitHub Variable: ACR_NAMESPACE"; exit 1; }
          test -n "$USERNAME"  || { echo "::error::缺少 GitHub Secret: ACR_USERNAME"; exit 1; }
          test -n "$PASSWORD"  || { echo "::error::缺少 GitHub Secret: ACR_PASSWORD"; exit 1; }

      - name: Diagnose ACR credentials (不打印密码内容)
        env:
          PASSWORD: ${{ secrets.ACR_PASSWORD }}
          USERNAME: ${{ secrets.ACR_USERNAME }}
        run: |
          echo "password_length=${#PASSWORD}"
          echo "username_length=${#USERNAME}"
          last_char="${PASSWORD: -1}"
          first_char="${PASSWORD:0:1}"
          if [ "$last_char" = $'\n' ]; then
            echo "::warning::ACR_PASSWORD 末尾有换行符 (newline)"
          else
            echo "OK: 密码末尾没有换行符"
          fi
          if [ "$last_char" = $'\r' ]; then
            echo "::warning::ACR_PASSWORD 末尾有回车符 (CR)"
          fi
          if [ "$last_char" = ' ' ] || [ "$first_char" = ' ' ]; then
            echo "::warning::ACR_PASSWORD 首尾有空格"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # docker-container 驱动才支持 gha 缓存导出（docker 默认驱动不支持）
          driver: docker-container

      - name: Login to Aliyun ACR
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
        run: |
          printf '%s' "$ACR_PASSWORD" > /tmp/acr_pw
          docker login --username "$ACR_USERNAME" --password-stdin "$ACR_REGISTRY" < /tmp/acr_pw
          rm -f /tmp/acr_pw

      - name: Build and push native image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ env.PLATFORM }}
          tags: |
            ${{ env.IMAGE_BASE }}:${{ github.sha }}
            ${{ env.IMAGE_BASE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-ecs:
    needs: build-and-push
    environment: aliyun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy on ECS
        if: ${{ env.ECS_HOST != '' }}
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          # 部署固定到具体 commit，latest 只留给手动使用
          IMAGE: ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/misakanetworks-core:${{ inputs.deploy_version || github.sha }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT || '22' }}
          envs: ACR_USERNAME,ACR_PASSWORD,IMAGE
          script: |
            cd ${{ vars.ECS_APP_DIR || '~/misakanetworks-core' }}
            git pull --ff-only
            printf '%s' "$ACR_PASSWORD" > /tmp/acr_pw
            docker login --username "$ACR_USERNAME" --password-stdin "${{ vars.ACR_REGISTRY }}" < /tmp/acr_pw
            rm -f /tmp/acr_pw
            IMAGE="$IMAGE" docker compose -f docker-compose.prod.yml pull
            IMAGE="$IMAGE" docker compose -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload || true
